<!DOCTYPE html>
<html lang="pt-BR">

    <head>
        <meta charset="UTF-8">
        <title>Meu Site</title>
        <link rel="stylesheet" href="style.css">
        <link rel="icon" href="siteicon.ico" type="image/x-icon">
    </head>

    <body>
        <!-- topo do site -->
        <header class="topo">

            <div class="logo">
            <h1>Um Site</h1>
            </div>

            <div class="menu">
                <nav>
                    <ul>
                        <li><a href="index.html" target="_self">Inicio</a></li>
                        <li><a href="testes.html" target="_self">Pag de testes</a></li>
                        <li><a href="form.html" target="_self">Formulário</a></li>
                        <li><a href="formulario.html" target="_self">Form professor</a></li>
                    </ul>
                </nav>
            </div>

        </header>

        <body>
            <form action="index.html" method="post" enctype="multipart/form-data">
                <fieldset class="cadastro">
                    <legend>Cadastro</legend>
                    <div>
                        <label for="txtNome">Nome:</label>
                        <input type="text" name="nNome" id="txtNome" size="20" placeholder="Digite seu nome" required>
                    </div>

                    <div>
                        <label for="txtCpf">CPF:</label>
                        <input type="text" name="nCpf" id="txtCpf" placeholder="Digite seu CPF" 
                            pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}" 
                            title="Digite um CPF válido no formato: 000.000.000-00">
                    </div>

                    <div>
                        <label for="txtEmail">E-Mail:</label>
                        <input type="email" name="nEmail" id="txtEmail" size="20" placeholder="Digite seu email">
                    </div>

                    <div>
                        <label for="txtIdade">Idade:</label>
                        <input type="number" name="nIdade" id="txtIdade" min="18" max="60" value="1">
                    </div>
                    <div>
                        <label for="txtDataNascimento">Data de Nascimento:</label>
                        <input type="date" name="nDataNascimento" id="txtDataNascimento">
                    </div>
                    <div>
                        Sexo: 
                        <input checked type="radio" name="nSexo" id="radioMasc" value="M">
                        <label for="radioMasc">Masculino</label>

                        <input type="radio" name="nSexo" id="radioFem" value="F">
                        <label for="radioFem">Feminino</label>

                        <input type="radio" name="nSexo" id="radioOutros" value="O">
                        <label for="radioOutros">Outro:</label>
                        <input type="text" name="nSexo" id="txtSexo" size="20" placeholder="Insirir texto:">

                    </div>
                    <div>
                        <label for="selEstado">Selecione um estado:</label>
                        <select id="selEstado"> 
                            <optgroup label="Região Norte">
                                <option value="AM">Amazonas</option>
                                <option value="PA">Pará</option> 
                            <optgroup label="Região Centro-Oeste">
                                <option value="GO">Goiás</option>
                                <option value="MT">Mato Grosso</option>
                                <option value="MS">Mato Grosso do Sul</option>
                            </optgroup>
                            <optgroup label="Região Sudeste">
                                <option value="SP">São Paulo</option>
                                <option value="RJ">Rio de Janeiro</option>
                            </optgroup>
                        </select>
                    </div>

                    <div>
                        <label for="txtCidade">Cidade:</label>
                        <input list="dlCidades" name="nCidade" id="txtCidade" placeholder="Digite sua cidade">
                        <datalist id="dlCidades">
                            <option value="São Paulo">São Paulo</option>
                            <option value="Rio de Janeiro">Rio de Janeiro</option>
                            <option value="Belo Horizonte">Belo Horizonte</option>
                            <option value="Curitiba">Curitiba</option>
                            <option value="Porto Alegre">Porto Alegre</option>
                        </datalist>
                    </div>

                    <div>
                        <label for="txtMensagem">Mensagem:</label>
                        <textarea name="nMensagem" id="txtMensagem" cols="45" rows="10" placeholder="Digite sua mensagem"></textarea>
                    </div>

                    <div>
                        <label for="txtCor">Cor favorita:</label>
                        <input type="color" name="nCor" id="txtCor" value="#4FFFCF">
                    </div>

                    <div>
                        <label for="sldRange">Slide:</label>
                        0%
                        <input type="range" name="nRange" id="sldRange" min="0" max="100" value="50" step="8"> 
                        100%
                    </div>

                    <div>
                        <input type="checkbox" name="nChkBox" id="chkBox" value="1" checked>
                        <label for="chkBox">Estou ciente que esse site é puramente para testes</label>
                    </div>

                    <div>
                        <label for="txtSenha">Senha:</label>
                        <input type="password" name="nSenha" id="txtSenha" size="20" placeholder="Digite sua senha">
                    </div>
                    
                    <div>
                        <input type="file" name="nArquivo[]" id="txtArquivo" multiple>
                    </div>


                    <div>
                        <input type="button" name="btnBotao" id="btnBotao" value="Não clique aqui !" onclick="alert('Você foi hackeado, parabéns!')">
                        <label for="btnEnviar">Enviar Formulário</label>
                        <button name="btnEnviar" type="submit">Enviar</button>
                        <label for="btnReset">Limpar Formulário</label>
                        <button name="btnReset" type="reset">Reset</button>
                    </div>
                </fieldset>

            </form>
        </body>

</html>
